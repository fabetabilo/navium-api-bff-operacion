name: CI/CD bff-operacion

on:
  push:
    branches: [ "deploy" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Build con Maven
        run: chmod +x ./mvnw && ./mvnw clean package -DskipTests -q

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y push imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/bff-operacion:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            mkdir -p ~/bff-operacion
            cd ~/bff-operacion

            # Crear .env
            echo "API_ANDENES_URL=${{ secrets.API_ANDENES_URL }}"             > .env
            echo "API_CONTENEDORES_URL=${{ secrets.API_CONTENEDORES_URL }}"  >> .env
            echo "API_AGENDAMIENTOS_URL=${{ secrets.API_AGENDAMIENTOS_URL }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"                       >> .env

            # Traer imagen nueva
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/bff-operacion:latest

            # Limpiar contenedor anterior
            sudo docker compose down || true
            sudo docker rm -f navium_bff_andenes || true

            # Crear docker-compose.yml
            cat <<EOF > docker-compose.yml
            services:
              bff-operacion:
                image: ${{ secrets.DOCKER_USERNAME }}/bff-operacion:latest
                container_name: navium_bff_andenes
                ports:
                  - "8086:8086"
                env_file:
                  - .env
                restart: always
            EOF

            # Levantar
            sudo docker compose up -d

            # Limpiar imágenes viejas
            sudo docker image prune -f